
workflows:
  autoroutevpn-android:
    name: AutoRoute VPN - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper/dists

    scripts:
      - name: Prepare Modern Android SDK 36
        script: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          TOOLS_DIR="$SDK_ROOT/cmdline-tools"
          TEMP_DIR="$CM_BUILD_DIR/android-tools-temp"

          mkdir -p "$SDK_ROOT" "$TOOLS_DIR" "$TEMP_DIR"

          echo "Android SDK: $SDK_ROOT"
          java -version

          # Remove old command-line tools to prevent legacy sdkmanager usage.
          rm -rf "$TOOLS_DIR/latest"

          echo "Downloading modern Android command-line tools..."

          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-mac-13114758_latest.zip" \
            --output "$TEMP_DIR/commandline-tools.zip"

          mkdir -p "$TEMP_DIR/extracted"

          unzip -q -o \
            "$TEMP_DIR/commandline-tools.zip" \
            -d "$TEMP_DIR/extracted"

          if [ ! -f "$TEMP_DIR/extracted/cmdline-tools/bin/sdkmanager" ]; then
            echo "ERROR: Modern sdkmanager was not found."
            exit 1
          fi

          mkdir -p "$TOOLS_DIR/latest"

          cp -R "$TEMP_DIR/extracted/cmdline-tools/." \
            "$TOOLS_DIR/latest/"

          SDKMANAGER="$TOOLS_DIR/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager is not executable."
            exit 1
          fi

          echo "Using modern sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-36"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$CM_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$CM_ENV"

          echo "Modern Android SDK setup completed."

      - name: Extract and Locate Project
        script: |
          set -e

          ZIP_FILE="$CM_BUILD_DIR/AutoRouteVPN-updated.zip"
          SOURCE_DIR="$CM_BUILD_DIR/source"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: AutoRouteVPN-updated.zip not found!"
            ls -la "$CM_BUILD_DIR"
            exit 1
          fi

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found!"
            find "$SOURCE_DIR" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

          echo "Project located:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Install Gradle 8.13
        script: |
          set -e

          GRADLE_VERSION="8.13"
          GRADLE_DIR="$CM_BUILD_DIR/gradle-install"
          GRADLE_HOME="$GRADLE_DIR/gradle-$GRADLE_VERSION"
          GRADLE_BIN="$GRADLE_HOME/bin/gradle"

          mkdir -p "$GRADLE_DIR"

          if [ ! -x "$GRADLE_BIN" ]; then
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
              --output "$GRADLE_DIR/gradle.zip"

            unzip -q -o "$GRADLE_DIR/gradle.zip" \
              -d "$GRADLE_DIR"
          fi

          if [ ! -x "$GRADLE_BIN" ]; then
            echo "ERROR: Gradle installation failed!"
            exit 1
          fi

          "$GRADLE_BIN" --version

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"

      - name: Configure Android Project
        script: |
          set -e

          cd "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

          FILE="app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            FILE="app/build.gradle"
          fi

          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          patterns = [
              r'(?m)^(\s*compileSdk\s*=\s*)\d+(\s*(?://.*)?)$',
              r'(?m)^(\s*compileSdk\s+)\d+(\s*(?://.*)?)$'
          ]

          updated = content
          changed = False

          for pattern in patterns:
              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + "36" + m.group(2),
                  updated,
                  count=1
              )

              if count:
                  changed = True
                  break

          if not changed:
              raise SystemExit(
                  "ERROR: Numeric compileSdk declaration not found. "
                  "Check the Gradle configuration."
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(updated)

          print("compileSdk configured to 36.")
          PY

          grep -n "compileSdk" "$FILE"

      - name: Build Debug APK
        script: |
          set -e

          cd "$PROJECT_DIR"

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleDebug

      - name: Verify and Collect APK
        script: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/output"

          cp "$APK" \
            "$CM_BUILD_DIR/output/AutoRouteVPN-debug.apk"

          echo "APK successfully generated:"
          ls -lh "$CM_BUILD_DIR/output/AutoRouteVPN-debug.apk"

    artifacts:
      - output/AutoRouteVPN-debug.apk
      
