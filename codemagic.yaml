
name: AutoRoute VPN APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoRouteVPN-updated.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Project
        run: |
          unzip -o AutoRouteVPN-updated.zip -d source

      - name: Verify Project Files
        run: |
          ls -la source/AutoRouteVPN
          test -f source/AutoRouteVPN/settings.gradle || test -f source/AutoRouteVPN/settings.gradle.kts

      - name: Build Debug APK
        run: |
          cd source/AutoRouteVPN
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRouteVPN-APK
          path: source/AutoRouteVPN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
