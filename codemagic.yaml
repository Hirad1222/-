
workflows:
  autoroutevpn-android:
    name: AutoRoute VPN - Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Install Android SDK 36
        script: |
          set -e
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-36"

      - name: Extract project ZIP
        script: |
          set -e
          ZIP_FILE="$CM_BUILD_DIR/AutoRouteVPN-updated.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: AutoRouteVPN-updated.zip not found!"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/source"
          unzip -o "$ZIP_FILE" -d "$CM_BUILD_DIR/source"

      - name: Locate Android project
        script: |
          set -e

          SETTINGS_FILE=$(find "$CM_BUILD_DIR/source" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found!"
            find "$CM_BUILD_DIR/source" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Configure Android SDK
        script: |
          set -e
          cd "$PROJECT_DIR"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          FILE="app/build.gradle.kts"
          if [ ! -f "$FILE" ]; then
            FILE="app/build.gradle"
          fi

          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          patterns = [
              r'compileSdk\s*=\s*\d+',
              r'compileSdk\s+\d+'
          ]

          updated = content
          for pattern in patterns:
              updated, count = re.subn(
                  pattern,
                  lambda m: re.sub(r'\d+', '36', m.group()),
                  updated,
                  count=1
              )
              if count:
                  break

          if updated != content:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)
              print("compileSdk updated to 36")
          else:
              print("WARNING: compileSdk was not changed automatically")
          PY

      - name: Build Debug APK
        script: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            gradle --no-daemon --stacktrace assembleDebug
          else
            echo "ERROR: Gradle is not available!"
            exit 1
          fi

      - name: Verify and prepare APK
        script: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/output"
          cp "$APK" "$CM_BUILD_DIR/output/AutoRouteVPN-debug.apk"

          echo "APK successfully generated:"
          ls -lh "$CM_BUILD_DIR/output/AutoRouteVPN-debug.apk"

    artifacts:
      - output/AutoRouteVPN-debug.apk
      
