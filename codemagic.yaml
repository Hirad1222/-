
workflows:
  autoroutevpn-android:
    name: AutoRoute VPN Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper/dists

    scripts:
      - name: Configure Android SDK
        script: |
          set -e

          SDK_ROOT="/usr/local/share/android-sdk"
          TOOLS_DIR="$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$TOOLS_DIR/latest/bin/sdkmanager"
          TEMP_DIR="$CM_BUILD_DIR/android-sdk-tools"

          mkdir -p "$SDK_ROOT" "$TOOLS_DIR" "$TEMP_DIR"

          echo "========== SDK SETUP =========="
          echo "SDK: $SDK_ROOT"
          java -version

          # Use the SDK manager supplied by Codemagic first.
          if [ -x "$SDKMANAGER" ]; then
            echo "Found installed sdkmanager."
          else
            echo "sdkmanager not found. Installing command-line tools."

            curl --fail --show-error --location --retry 3 \
              "https://dl.google.com/android/repository/commandlinetools-mac-13114758_latest.zip" \
              -o "$TEMP_DIR/tools.zip"

            mkdir -p "$TEMP_DIR/unpacked"
            unzip -q -o "$TEMP_DIR/tools.zip" \
              -d "$TEMP_DIR/unpacked"

            test -x "$TEMP_DIR/unpacked/cmdline-tools/bin/sdkmanager"

            mkdir -p "$TOOLS_DIR"
            rm -rf "$TOOLS_DIR/latest"

            mv "$TEMP_DIR/unpacked/cmdline-tools" \
              "$TOOLS_DIR/latest"
          fi

          # Test the exact executable, never the PATH version.
          if ! "$SDKMANAGER" --version; then
            echo "Installed SDK manager is incompatible."
            echo "Installing a fresh command-line tools package."

            curl --fail --show-error --location --retry 3 \
              "https://dl.google.com/android/repository/commandlinetools-mac-13114758_latest.zip" \
              -o "$TEMP_DIR/tools.zip"

            rm -rf "$TEMP_DIR/unpacked"
            mkdir -p "$TEMP_DIR/unpacked"

            unzip -q -o "$TEMP_DIR/tools.zip" \
              -d "$TEMP_DIR/unpacked"

            test -x "$TEMP_DIR/unpacked/cmdline-tools/bin/sdkmanager"

            rm -rf "$TOOLS_DIR/latest"

            mv "$TEMP_DIR/unpacked/cmdline-tools" \
              "$TOOLS_DIR/latest"
          fi

          SDKMANAGER="$TOOLS_DIR/latest/bin/sdkmanager"

          echo "Verified SDK manager:"
          "$SDKMANAGER" --version

          # Accept Android SDK licenses.
          set +e
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses
          LICENSE_STATUS=$?
          set -e

          if [ "$LICENSE_STATUS" -gt 1 ]; then
            echo "License command returned status $LICENSE_STATUS"
          fi

          # Install Android SDK packages.
          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "PATH=$SDK_ROOT/platform-tools:$PATH"
          } >> "$CM_ENV"

          echo "========== SDK READY =========="

      - name: Extract and Locate Project
        script: |
          set -e

          ZIP_FILE="$CM_BUILD_DIR/AutoRouteVPN-updated.zip"
          SOURCE_DIR="$CM_BUILD_DIR/source"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            ls -la "$CM_BUILD_DIR"
            exit 1
          fi

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          echo "Project files:"
          find "$SOURCE_DIR" -maxdepth 4 -type f | head -200

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Install Gradle 8.13
        script: |
          set -e

          VERSION="8.13"
          INSTALL_DIR="$CM_BUILD_DIR/gradle-install"
          GRADLE_HOME="$INSTALL_DIR/gradle-$VERSION"
          GRADLE_BIN="$GRADLE_HOME/bin/gradle"

          mkdir -p "$INSTALL_DIR"

          if [ ! -x "$GRADLE_BIN" ]; then
            curl --fail --show-error --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip" \
              -o "$INSTALL_DIR/gradle.zip"

            unzip -q -o "$INSTALL_DIR/gradle.zip" \
              -d "$INSTALL_DIR"
          fi

          "$GRADLE_BIN" --version

          echo "GRADLE_BIN=$GRADLE_BIN" >> "$CM_ENV"

      - name: Prepare Android Project
        script: |
          set -e

          cd "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          echo "Project Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle.properties" \)

          echo "Original compileSdk:"
          grep -R -n "compileSdk" app/build.gradle \
            app/build.gradle.kts 2>/dev/null || true

          echo "No forced compileSdk modification."

      - name: Build Debug APK
        script: |
          set -e

          cd "$PROJECT_DIR"

          echo "========== BUILD START =========="

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

          echo "========== BUILD FINISHED =========="

      - name: Verify and Collect APK
        script: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/output"

          cp "$APK" \
            "$CM_BUILD_DIR/output/AutoRouteVPN-debug.apk"

          echo "APK generated successfully:"
          ls -lh "$CM_BUILD_DIR/output/AutoRouteVPN-debug.apk"

    artifacts:
      - output/AutoRouteVPN-debug.apk
      - '**/build/outputs/**/*.apk'
      
