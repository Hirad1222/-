
name: AutoRoute VPN APK Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -o AutoRouteVPN-updated.zip -d source
          find source -name gradlew -type f

      - name: Build APK
        run: |
          cd source/AutoRouteVPN
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRouteVPN-APK
          path: source/AutoRouteVPN/app/build/outputs/apk/debug/app-debug.apk
          
