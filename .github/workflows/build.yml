
name: AutoRoute VPN - Android APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AutoRouteVPN-updated.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: autoroutevpn-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AutoRoute VPN APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36"

          echo "Android SDK packages:"
          sdkmanager --list_installed

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AutoRouteVPN-updated.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP was not found."
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

          echo "Extracted project files:"
          find source -maxdepth 4 -type f | head -100

      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find source -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configure Compile SDK 36
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            FILE="$PROJECT_DIR/app/build.gradle"
          fi

          if [ ! -f "$FILE" ]; then
            echo "ERROR: App Gradle configuration not found."
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          patterns = [
              (r'compileSdk\s*=\s*\d+', 'compileSdk = 36'),
              (r'compileSdk\s+\d+', 'compileSdk 36'),
          ]

          updated = content

          for pattern, replacement in patterns:
              updated, count = re.subn(pattern, replacement, updated, count=1)
              if count:
                  break

          if updated == content:
              print("WARNING: compileSdk was not changed automatically.")
              print("Current configuration:")
              for line in content.splitlines():
                  if "compileSdk" in line:
                      print(line)
          else:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)
              print("compileSdk successfully set to 36.")
          PY

          grep -n "compileSdk" "$FILE" || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/AutoRouteVPN-debug.apk"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoRouteVPN-APK
          path: output/AutoRouteVPN-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Failure Information
        if: failure()
        shell: bash
        run: |
          echo "===================================="
          echo "AutoRoute VPN BUILD FAILED"
          echo "===================================="
          echo "Please inspect the failed step above."
          echo "Android SDK:"
          sdkmanager --list_installed || true
          echo "Java:"
          java -version
          echo "Gradle:"
          gradle --version
          
