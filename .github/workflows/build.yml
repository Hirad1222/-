name: AutoRoute VPN APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoRouteVPN-updated.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Project
        run: |
          unzip -o AutoRouteVPN-updated.zip -d source

      - name: Verify Project
        run: |
          ls -la source/AutoRouteVPN
          test -f source/AutoRouteVPN/settings.gradle.kts || test -f source/AutoRouteVPN/settings.gradle

      - name: Update Compile SDK
        run: |
          FILE="source/AutoRouteVPN/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            FILE="source/AutoRouteVPN/app/build.gradle"
          fi

          if [ ! -f "$FILE" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found"
            exit 1
          fi

          sed -i -E \
            's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g; s/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' \
            "$FILE"

          echo "Updated compile SDK:"
          grep -n "compileSdk" "$FILE"

      - name: Build Debug APK
        run: |
          cd source/AutoRouteVPN
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="source/AutoRouteVPN/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRouteVPN-APK
          path: source/AutoRouteVPN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
